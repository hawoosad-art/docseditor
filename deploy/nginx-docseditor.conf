# DocsEditor site — place at /etc/nginx/sites-available/docseditor.conf
# The setup script does this automatically; DOMAIN placeholder is replaced by
# deploy/setup.sh with the domain you pass it.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Let's Encrypt HTTP-01 challenge (certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # uploads: card photos (8 MB), PSDs and APKs go through the app
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

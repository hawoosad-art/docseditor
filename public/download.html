<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="icon" type="image/webp" href="/ic_launcher_round.webp"/>
<title>Download FaceGate — facedocs.bond</title>
<meta name="description" content="Download FaceGate APK — facedocs.bond"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c14;--card:#111827;--border:#1f2937;--accent:#3b82f6;--text:#e5e7eb;--muted:#9ca3af}
body{font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
a{color:#60a5fa;text-decoration:none}
.nav{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(8,12,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.btn{border:1px solid var(--border);background:#111827;color:var(--text);padding:12px 22px;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-1px);border-color:#243049}
.btn-primary{background:linear-gradient(135deg,#2563eb,#1d4ed8);border-color:transparent;color:white;box-shadow:0 10px 24px rgba(37,99,235,.3);padding:14px 28px;font-size:15px}
.btn-primary:hover{box-shadow:0 14px 32px rgba(37,99,235,.4)}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px;flex:1;display:flex;flex-direction:column;justify-content:center}
.hero{text-align:center;padding:20px 0 8px}
.hero h1{font-size:32px;letter-spacing:-.02em;font-weight:800}
.hero p{color:var(--muted);margin-top:8px;line-height:1.6;font-size:14px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--border);border-radius:16px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.file-name{font-weight:700;word-break:break-all;font-size:15px}
.file-meta{color:var(--muted);font-size:12px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;border:1px dashed var(--border);border-radius:14px}
.badge{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--border);background:#0b1220;color:var(--muted)}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" style="font-weight:800;display:flex;align-items:center;gap:9px">
    <img src="/ic_launcher_round.webp" alt="FaceGate" style="width:28px;height:28px;border-radius:8px;object-fit:cover;background:#0a0a0a;border:1px solid #1f2937;display:block"/>
    FaceGate
  </a>
  <a class="btn" href="/" style="padding:8px 14px;font-size:13px">Login</a>
</nav>

<div class="wrap">
  <div class="hero">
    <h1>Download FaceGate</h1>
    <p>Tap below to install the latest build.</p>
  </div>

  <div id="content"></div>

  <p style="text-align:center;color:var(--muted);font-size:11px;margin-top:18px">© 2026 FaceGate • facedocs.bond</p>
</div>

<script>
function timeAgo(iso){
  const d = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(d/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + ' mins ago';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return hrs + ' hr' + (hrs>1?'s':'') + ' ago';
  const days = Math.floor(hrs/24);
  return days + ' day' + (days>1?'s':'') + ' ago';
}
async function load(){
  const el = document.getElementById('content');
  el.innerHTML = '<div class="card empty">Loading…</div>';
  try{
    const r = await fetch('/api/downloads');
    const j = await r.json();
    // filter only apk (user wants only apk)
    const apks = Array.isArray(j) ? j.filter(f=>f.filename.toLowerCase().endsWith('.apk')) : [];
    if(apks.length===0){
      el.innerHTML = '<div class="card empty">No APK available yet.<br><span style="font-size:12px">Please check back after the next build finishes.</span></div>';
      return;
    }
    // pick newest apk (already sorted newest first)
    const latest = apks[0];
    const sizeMB = (latest.size/1024/1024).toFixed(2);
    const date = new Date(latest.mtime).toLocaleString();
    const ago = timeAgo(latest.mtime);
    el.innerHTML = `
      <div class="card" style="text-align:center">
        <img src="/ic_launcher_round.webp" alt="FaceGate" style="width:64px;height:64px;margin:0 auto 14px;border-radius:16px;object-fit:cover;border:1px solid #1f2937;display:block"/>
        <div class="file-name">FaceGate.apk</div>
        <div class="file-meta">${sizeMB} MB • ${ago}</div>
        <a class="btn btn-primary" href="/files/FaceGate.apk" download style="width:100%;margin-top:18px">⬇ Download APK</a>
        <div class="file-meta" style="margin-top:10px">${date} • <a href="/files/FaceGate.apk">FaceGate.apk</a></div>
        <div style="margin-top:20px;text-align:left;border-top:1px solid var(--border);padding-top:16px">
          <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--text)">Install Steps</div>
          <div style="display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="flex-shrink:0;width:24px;height:24px;border-radius:999px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;display:grid;place-items:center;font-size:12px;font-weight:700">1</span>
              <span style="color:var(--muted);font-size:13px;line-height:1.5;padding-top:3px">Uninstall old version from device</span>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="flex-shrink:0;width:24px;height:24px;border-radius:999px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;display:grid;place-items:center;font-size:12px;font-weight:700">2</span>
              <span style="color:var(--muted);font-size:13px;line-height:1.5;padding-top:3px">Download the new version of FaceGate</span>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px">
              <span style="flex-shrink:0;width:24px;height:24px;border-radius:999px;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:white;display:grid;place-items:center;font-size:12px;font-weight:700">3</span>
              <span style="color:var(--muted);font-size:13px;line-height:1.5;padding-top:3px">Install</span>
            </div>
          </div>
        </div>
      </div>
    `;
  }catch(e){
    el.innerHTML = '<div class="card empty" style="color:#f87171">Failed to load: '+e.message+'</div>';
  }
}
load();
</script>
</body>
</html>
